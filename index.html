<style>
  :root { color-scheme: dark; --bg:#0f0a08; --panel:#1a1311; --line:#2d2320; --text:#f3ece6; --dim:#a99b92; --gold:#ffdd97; --red:#a43b38; --ok:#6fcf97; --bad:#ef6b5f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .btn { border:0; border-radius:999px; padding:.65rem 1.1rem; background:#2b211e; font-weight:600; }
  .btn.gold { background:var(--gold); color:#1a1109; }
  .btn.red { background:var(--red); color:#fff; }
  .btn.ghost { background:transparent; border:1px solid var(--line); }
  .btn:disabled { opacity:.45; cursor:default; }
  .center { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2rem; gap:1rem; }
  .logo { font:800 2.4rem Georgia,"Playfair Display",serif; color:var(--gold); letter-spacing:.02em; }
  .dim { color:var(--dim); }
  .bar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:.75rem; padding:.7rem 1rem; background:rgba(15,10,8,.95); border-bottom:1px solid var(--line); }
  .bar h1 { margin:0; font:700 1.15rem Georgia,serif; color:var(--gold); flex:1; }
  .icon { background:none; border:0; font-size:1.5rem; padding:.2rem .5rem; }
  .avatar { width:32px; height:32px; border-radius:50%; background:#2b211e; }
  .drawer-bg { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:8; }
  .drawer { position:fixed; top:0; left:0; bottom:0; width:260px; background:var(--panel); z-index:9; padding:1rem 0; overflow:auto; }
  .drawer .who { padding:.5rem 1.2rem 1rem; border-bottom:1px solid var(--line); margin-bottom:.5rem; word-break:break-all; }
  .nav { display:flex; width:100%; text-align:left; align-items:center; gap:.7rem; background:none; border:0; padding:.85rem 1.2rem; font-size:1rem; }
  .nav.on { background:#2b211e; color:var(--gold); }
  .nav .n { margin-left:auto; background:var(--red); color:#fff; border-radius:999px; font-size:.75rem; padding:0 .5rem; }
  main { padding:1rem; max-width:1100px; margin:0 auto; padding-bottom:6rem; }
  .tools { display:flex; gap:.6rem; flex-wrap:wrap; margin-bottom:1rem; align-items:center; }
  .tools input[type=search], .tools select, input.txt { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:.6rem .8rem; font:inherit; }
  .tools input[type=search] { flex:1; min-width:140px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:14px 10px; }
  .tile { cursor:pointer; position:relative; }
  .poster { position:relative; aspect-ratio:2/3; border-radius:8px; overflow:hidden; background:#241b18; }
  .poster img { width:100%; height:100%; object-fit:cover; display:block; }
  .noposter { display:flex; align-items:center; justify-content:center; height:100%; font-size:2rem; }
  .badge { position:absolute; top:5px; right:5px; background:rgba(0,0,0,.75); border-radius:6px; padding:0 .4rem; font-size:.78rem; }
  .check { position:absolute; top:5px; left:5px; width:24px; height:24px; border-radius:50%; background:rgba(0,0,0,.6); border:2px solid #fff; display:flex; align-items:center; justify-content:center; font-weight:800; }
  .tile.sel .poster { outline:3px solid var(--gold); }
  .tile.sel .check { background:var(--gold); color:#1a1109; border-color:var(--gold); }
  .tile .t { margin-top:.35rem; font-size:.88rem; line-height:1.2; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tile .y { font-size:.78rem; color:var(--dim); }
  .tile.dim .poster { opacity:.5; }
  .selbar { position:fixed; left:0; right:0; bottom:0; z-index:6; display:flex; gap:.6rem; align-items:center; padding:.8rem 1rem; background:var(--panel); border-top:1px solid var(--line); }
  .selbar .c { flex:1; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:1rem; margin-bottom:1rem; }
  .row { display:flex; align-items:center; gap:.7rem; padding:.7rem .2rem; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row .grow { flex:1; min-width:0; }
  .row .sub { color:var(--dim); font-size:.82rem; word-break:break-all; }
  .row.off { opacity:.5; }
  .chip { display:inline-block; padding:.1rem .6rem; border-radius:999px; background:#2b211e; font-size:.8rem; margin:.1rem .25rem .1rem 0; }
  .chip.ok { color:var(--ok); } .chip.bad { color:var(--bad); } .chip.warn { color:var(--gold); }
  .head { display:flex; gap:1rem; margin-bottom:1rem; }
  .head .poster { width:100px; flex:none; }
  .head h2 { margin:.1rem 0 .4rem; }
  .actions { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.6rem; }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  .modal { background:var(--panel); width:100%; max-width:560px; max-height:92vh; overflow:auto; border-radius:18px 18px 0 0; padding:1.2rem; }
  @media (min-width:700px) { .modal-bg { align-items:center; } .modal { border-radius:18px; } }
  .modal-x { position:fixed; top:14px; right:14px; z-index:21; width:44px; height:44px; border-radius:50%; border:0; background:rgba(40,32,30,.92); color:#fff; font-size:20px; line-height:1; cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.5); }
  .wbadge { position:absolute; left:6px; top:6px; background:rgba(111,207,151,.92); color:#07210f; font-size:.72rem; font-weight:700; padding:.1rem .45rem; border-radius:999px; }
  .credit { color:var(--dim); font-size:.75rem; line-height:1.4; text-align:center; margin:2rem 0 5rem; }
  .sect { margin:1.4rem 0 .6rem; font:700 1.05rem Georgia,serif; color:var(--gold); }
  .grp { display:flex; align-items:center; gap:.5rem; color:var(--dim); font-size:.9rem; flex-basis:100%; }
  .pbar { position:absolute; left:0; right:0; bottom:0; height:5px; background:rgba(0,0,0,.6); }
  .pbar i { display:block; height:100%; background:var(--gold); }
  .on { color:var(--ok); }
  .off { color:var(--dim); }
  .dot { font-size:.7rem; }
  #scanner { position:fixed; inset:0; z-index:40; background:#000; }
  #scanner video { width:100%; height:100%; object-fit:cover; }
  #scanner .scan-hint { position:absolute; left:0; right:0; bottom:2.5rem; text-align:center; color:#fff; text-shadow:0 1px 6px #000; padding:0 1rem; }
  #scanner .scan-x { position:absolute; top:14px; right:14px; width:44px; height:44px; border-radius:50%; border:0; background:rgba(40,32,30,.92); color:#fff; font-size:20px; }
  #scanner .scan-frame { position:absolute; left:50%; top:50%; width:min(70vw,320px); aspect-ratio:1; transform:translate(-50%,-50%); border:3px solid var(--gold); border-radius:18px; box-shadow:0 0 0 100vmax rgba(0,0,0,.45); }
  .tvpick { display:flex; gap:.5rem; overflow-x:auto; margin-bottom:.9rem; padding-bottom:.2rem; }
  .tvpick .btn { white-space:nowrap; flex:none; }
  .avatar-btn { background:none; border:0; padding:0; line-height:0; }
  .avatar-btn .avatar { display:flex; align-items:center; justify-content:center; font-weight:700; line-height:1; }
  .modal h3 { margin:.1rem 0 .6rem; }
  .modal .btns { display:flex; gap:.6rem; justify-content:flex-end; margin-top:1rem; flex-wrap:wrap; }
  .cand { display:flex; gap:.8rem; padding:.6rem; border:1px solid var(--line); border-radius:10px; margin-bottom:.6rem; cursor:pointer; }
  .cand:hover, .cand.on { border-color:var(--gold); }
  .cand img, .cand .np { width:56px; height:84px; object-fit:cover; border-radius:6px; background:#241b18; flex:none; }
  .tabs { display:flex; gap:.4rem; margin-bottom:.8rem; }
  .tabs .btn.on { background:var(--gold); color:#1a1109; }
  .toast { position:fixed; left:50%; bottom:5.5rem; transform:translateX(-50%); background:#2b211e; border:1px solid var(--gold); padding:.7rem 1.1rem; border-radius:12px; z-index:30; max-width:90vw; }
  select.set { background:#2b211e; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:.45rem .5rem; font:inherit; max-width:55vw; }
  .tog { width:46px; height:26px; appearance:none; background:#3a2e2a; border-radius:999px; position:relative; cursor:pointer; flex:none; }
  .tog::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .15s; }
  .tog:checked { background:var(--gold); } .tog:checked::after { left:23px; background:#1a1109; }
  .changed { border-left:3px solid var(--gold); padding-left:.6rem; }
  .syncbar { position:sticky; bottom:0; display:flex; gap:.8rem; align-items:center; padding:.8rem 0; background:linear-gradient(transparent, var(--bg) 30%); }
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, reauthenticateWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, Timestamp, arrayUnion, arrayRemove, deleteField, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// ---- Fill these in from the Firebase console (see SETUP.md). They are not secrets: ----
// ---- the security rules, not these values, are what protect the data.               ----
const FIREBASE_CONFIG = { apiKey:"AIzaSyDK2xcgZHZQ-dBLgEX4IDln-y388fvLIkI", authDomain:"projector-room.firebaseapp.com", projectId:"projector-room", appId:"1:283528306112:web:5491e49c77e8107e5a3c25" };
const TMDB_KEY = "f25b5746aeb9317ce258c0a72afb861f"; // themoviedb.org API key (v3), used only to look up posters when fixing a match

const configured = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const root = document.getElementById("root");
// Deleting from Drive needs the Drive API turned on first (see the notes). Flip to true when ready.
const DELETE_ENABLED = false;
const CREDIT = `<p class="credit">Film and series details and posters: This product uses the TMDB API but is not endorsed or certified by TMDB. Projector Room is a private app for personal, non-commercial use.</p>`;

const S = {
  user: null, ready: false,
  space: null, joined: [], members: [], allDevs: {}, chunks: {}, overrides: {}, settings: null, status: null, devices: [],
  view: "library", seriesId: null, selecting: false, sel: new Set(),
  q: "", sort: "new", filter: "all", group: true, drawer: false, pending: {}, modal: null, toast: null,
  linkParam: new URLSearchParams(location.search).get("link"),
  prefs: (() => { try { return JSON.parse(localStorage.getItem("pr_prefs") || "{}"); } catch (e) { return {}; } })(),
  tv: (() => { try { return localStorage.getItem("pr_tv"); } catch (e) { return null; } })(), installEvt: null,
};
let auth, db, unsubs = [], toastTimer;

// ---------- data helpers ----------
const savePrefs = () => { try { localStorage.setItem("pr_prefs", JSON.stringify({ sort: S.sort, filter: S.filter, group: S.group })); } catch (e) {} };
Object.assign(S, { sort: S.prefs.sort || "new", filter: S.prefs.filter || "all", group: S.prefs.group !== false });
// The space being managed: your own, or one you were invited to. Linking a TV always goes into your own.
const uidRef = (...p) => doc(db, "users", S.space || S.user.uid, ...p);
const ownRef = (...p) => doc(db, "users", S.user.uid, ...p);
const ownSpace = () => !S.space || S.space === S.user.uid;
const hiddenSet = () => new Set(S.overrides.hidden || []);
// The TV whose library is shown: the one picked last, else the first linked one.
const curTv = () => S.devices.some(d => d.id === S.tv) ? S.tv : (S.devices[0]?.id || null);
function allItems() {
  const m = new Map();
  const tv = curTv();
  for (const [cid, c] of Object.entries(S.chunks)) { if (tv && !cid.startsWith(tv + "_")) continue; for (const it of (c.items || [])) m.set(it.id, it); }
  return [...m.values()];
}
function disp(it) {
  const o = (S.overrides.tmdb || {})[it.id], t = (S.overrides.titles || {})[it.id];
  return { title: t || (o && o.title) || it.title, poster: (o && o.poster) || it.poster, year: (o && o.year) || it.year,
           renamed: !!t, chosen: !!o, matched: o ? true : !!it.matched };
}
const fmtDur = ms => { if (!ms) return ""; const m = Math.round(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}min` : `${m}min`; };
const ep = e => `S${String(e.season ?? 0).padStart(2, "0")} E${String(e.episode ?? 0).padStart(2, "0")}`;
const epLabel = e => (e.season != null || e.episode != null) ? ep(e) : "—";
function ago(ts) {
  if (!ts) return "never";
  const d = ts.toDate ? ts.toDate() : new Date(ts); const s = (Date.now() - d.getTime()) / 1000;
  if (s < 90) return "just now"; if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} hr ago`; return `${Math.round(s / 86400)} days ago`;
}
// "Watched" marks live in the same saved data as hides, so they survive signing out and in.
const watchedSet = () => new Set(S.overrides.watched || []);
function isW(id) {
  const it = allItems().find(i => i.id === id), w = watchedSet();
  if (it?.kind === "series" && it.episodes?.length) return it.episodes.every(e => w.has(e.id));
  return w.has(id);
}
// A series is marked through all of its episodes.
function watchIds(ids) {
  const out = new Set();
  for (const id of ids) { out.add(id); const it = allItems().find(i => i.id === id); if (it?.kind === "series") (it.episodes || []).forEach(e => out.add(e.id)); }
  return [...out];
}
async function setWatched(ids, on) {
  const all = watchIds(ids);
  await merge(uidRef("data", "overrides"), { watched: on ? arrayUnion(...all) : arrayRemove(...all) });
}
// Progress the TV reports. From 90% a film counts as finished, so stopping at the credits still counts.
const prog = x => Math.max(0, Math.min(1, x.progress || 0));
const epDone = e => prog(e) >= 0.9;
const tvDone = it => it.kind === "series" ? !!(it.episodes?.length && it.episodes.every(epDone)) : prog(it) >= 0.9;
const seen = it => isW(it.id) || tvDone(it);
// A TV checks in every ~15 seconds while it is on, so a recent "last seen" means it is online.
const seenMs = d => d.lastSeen?.toMillis ? d.lastSeen.toMillis() : 0;
const isOnline = d => Date.now() - seenMs(d) < 75000;
const statusHtml = d => isOnline(d) ? `<span class="on">● Online</span>` : `<span class="off">○ Offline · last seen ${ago(d.lastSeen)}</span>`;
function tickStatus() { document.querySelectorAll("[data-ls]").forEach(el => { const d = allDevices().find(x => x.id === el.dataset.ls); if (d) el.innerHTML = statusHtml(d); }); }
setInterval(tickStatus, 20000);
const visibleEps = it => (it.episodes || []).filter(e => !hiddenSet().has(e.id));
function toast(msg) { S.toast = msg; render(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; render(); }, 4000); }
const names = (ids) => { const m = new Map(); allItems().forEach(i => { m.set(i.id, disp(i).title); (i.episodes || []).forEach(e => m.set(e.id, `${disp(i).title} ${epLabel(e)}`)); }); return ids.map(i => m.get(i) || i); };

// ---------- writes ----------
const merge = (ref, data) => setDoc(ref, data, { merge: true });
async function hideIds(ids) { await merge(uidRef("data", "overrides"), { hidden: arrayUnion(...ids) }); }
async function unhideIds(ids) { await merge(uidRef("data", "overrides"), { hidden: arrayRemove(...ids) }); }
async function renameItem(id, text) { await merge(uidRef("data", "overrides"), { titles: { [id]: text ? text : deleteField() } }); }
async function chooseMatch(id, m) { await merge(uidRef("data", "overrides"), { tmdb: { [id]: { id: m.id, type: m.type, title: m.title, year: m.year || null, poster: m.poster || null } } }); }
async function resetMatch(id) { await merge(uidRef("data", "overrides"), { tmdb: { [id]: deleteField() } }); }

function confirmHide(ids, then) {
  const n = names(ids), shown = n.slice(0, 5).map(esc).join("<br>"), more = n.length > 5 ? `<br>…and ${n.length - 5} more` : "";
  S.modal = { type: "confirm", title: `Hide ${ids.length === 1 ? "this" : ids.length + " items"}?`,
    body: `${shown}${more}<p class="dim">They disappear from the TV but stay in Google Drive. You can bring them back any time from <b>Hidden</b>.</p>`,
    ok: "Hide", run: async () => { await hideIds(ids); S.sel.clear(); S.selecting = false; toast(`Hidden. The TV updates within a couple of minutes.`); if (then) then(); } };
  render();
}

// ---------- delete from Google Drive (moves files to Trash) ----------
// Needs the full Drive permission, asked only when you actually delete, and only for this session.
let driveTok = null;
async function driveToken() {
  if (driveTok && driveTok.exp > Date.now() + 60000) return driveTok.token;
  const p = new GoogleAuthProvider(); p.addScope("https://www.googleapis.com/auth/drive"); p.setCustomParameters({ login_hint: S.user.email });
  const r = await reauthenticateWithPopup(auth.currentUser, p);
  const tok = GoogleAuthProvider.credentialFromResult(r)?.accessToken;
  if (!tok) throw new Error("Google did not give permission to change Drive files.");
  driveTok = { token: tok, exp: Date.now() + 50 * 60000 };
  return tok;
}
async function trashFile(id, tok, trashed = true) {
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}?supportsAllDrives=true`,
    { method: "PATCH", headers: { Authorization: "Bearer " + tok, "Content-Type": "application/json" }, body: JSON.stringify({ trashed }) });
  if (r.ok) return null;
  let msg = ""; try { msg = (await r.json()).error?.message || ""; } catch (e) {}
  if (r.status === 404 || (r.status === 403 && /permission|forbidden|insufficient/i.test(msg))) return "this Google account can't change that file";
  return msg || ("error " + r.status);
}
// A series becomes its episode files; a film is itself.
function fileIds(ids) {
  const out = new Set();
  for (const id of ids) { const it = allItems().find(i => i.id === id); if (it && it.kind === "series") (it.episodes || []).forEach(e => out.add(e.id)); else out.add(id); }
  return [...out];
}
// What the Deleted tab remembers about a file (episodes are labelled with their series).
function infoFor(id) {
  const at = Date.now();
  for (const it of allItems()) {
    if (it.id === id) { const d = disp(it); return { title: d.title, year: d.year || null, kind: it.kind, at }; }
    const e = (it.episodes || []).find(x => x.id === id);
    if (e) return { title: `${disp(it).title} ${epLabel(e)}`, year: null, kind: "episode", at };
  }
  return { title: id, year: null, kind: "file", at };
}
function confirmDelete(ids) {
  const files = fileIds(ids), n = names(ids), shown = n.slice(0, 5).map(esc).join("<br>"), more = n.length > 5 ? `<br>…and ${n.length - 5} more` : "";
  if (!files.length) return toast("There are no files to delete.");
  S.modal = { type: "delete", ids, files, shown: shown + more, typed: files.length > 1, busy: false, progress: 0, error: null };
  render();
}

// ---------- settings and refresh are kept per TV ----------
let watchedTv = null, tvUnsubs = [], spaceUnsubs = [], devUnsubs = [];
const allDevices = () => Object.values(S.allDevs).flat();
function startAllDeviceWatchers() {
  devUnsubs.forEach(u => u()); devUnsubs = [];
  if (!S.user) return;
  const spaces = [S.user.uid, ...S.joined.map(j => j.owner)];
  S.allDevs = Object.fromEntries(Object.entries(S.allDevs).filter(([k]) => spaces.includes(k)));
  for (const sp of spaces) {
    devUnsubs.push(onSnapshot(collection(db, "users", sp, "devices"),
      s => { S.allDevs[sp] = s.docs.map(d => ({ id: d.id, space: sp, ...d.data() })); render(); },
      err => { if (err.code === "permission-denied" && sp !== S.user.uid) deleteDoc(ownRef("joined", sp)).catch(() => {}); }));
  }
}
function startSpaceWatchers() {
  spaceUnsubs.forEach(u => u()); spaceUnsubs = []; tvUnsubs.forEach(u => u()); tvUnsubs = []; watchedTv = null;
  Object.assign(S, { chunks: {}, overrides: {}, devices: [], settings: null, status: null });
  if (!S.user) return;
  const space = S.space || S.user.uid;
  const denied = err => {
    console.warn("listen", err.code);
    if (err.code === "permission-denied" && space !== S.user.uid) {
      deleteDoc(ownRef("joined", space)).catch(() => {}); setSpace(S.user.uid); toast("You no longer have access to that person's TVs.");
    }
  };
  const w = (ref, fn) => spaceUnsubs.push(onSnapshot(ref, fn, denied));
  w(collection(db, "users", space, "library"), s => { S.chunks = {}; s.forEach(d => S.chunks[d.id] = d.data()); render(); });
  w(doc(db, "users", space, "data", "overrides"), d => { S.overrides = d.exists() ? d.data() : {}; render(); });
  w(collection(db, "users", space, "devices"), s => { S.devices = s.docs.map(d => ({ id: d.id, ...d.data() })); watchTv(); render(); });
}
function setSpace(id, tvId, keepView) {
  S.space = id; S.tv = tvId || null; if (!keepView) S.view = "library"; S.selecting = false; S.sel.clear(); S.drawer = false; S.pending = {};
  try { localStorage.setItem("pr_space", id); } catch (e) {}
  startSpaceWatchers(); render();
}

const A = {

    m.busy = true; m.error = null; m.progress = 0; render();
    let tok;
    try { tok = await driveToken(); } catch (e) { m.busy = false; m.error = "Couldn't get permission: " + (e.code || e.message); return render(); }
    const meta = Object.fromEntries(m.files.map(id => [id, infoFor(id)]));
    const done = [], failed = []; let next = 0;
    const worker = async () => { while (next < m.files.length) { const id = m.files[next++]; const err = await trashFile(id, tok); (err ? failed.push(err) : done.push(id)); m.progress++; if (S.modal === m) render(); } };
    await Promise.all([worker(), worker(), worker(), worker()]);
    // Hiding them too makes the TV drop them straight away instead of at its next full reload.
    // ...and the Deleted tab keeps a record so they can be restored while Drive still has them.
    if (done.length) await merge(uidRef("data", "overrides"), { hidden: arrayUnion(...done), deleted: Object.fromEntries(done.map(id => [id, meta[id]])) });
    S.sel.clear(); S.selecting = false;
    if (S.view === "series" && !allItems().some(i => i.id === S.seriesId && visibleEps(i).length)) S.view = "library";
    closeModal();
    toast(failed.length ? `Moved ${done.length} to Trash. ${failed.length} couldn't be deleted: ${[...new Set(failed)][0]}.` : `Moved ${done.length} file${done.length > 1 ? "s" : ""} to Google Drive Trash.`);
  },
  "restore-del": async el => {
    const id = el.dataset.id, tok = await driveToken();
    const err = await trashFile(id, tok, false);
    if (err) return toast("Couldn't restore: " + err + ". It may have been removed from Trash already.");
    await merge(uidRef("data", "overrides"), { hidden: arrayRemove(id), deleted: { [id]: deleteField() } });
    toast("Restored to Google Drive. It comes back on the TV within a minute.");
  },
  "dismiss-del": async el => { await merge(uidRef("data", "overrides"), { deleted: { [el.dataset.id]: deleteField() } }); },
  "refresh-tv": async () => {
    const id = curTv(); if (!id) return toast("Link a TV first.");
    await merge(uidRef("data", "settings_" + id), { refreshAt: Date.now() });
    toast("Asked the TV to rescan Google Drive. New films appear here within a minute.");
  },
  space: el => setSpace(el.dataset.id),
  invite: async () => {
    const A8 = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let code = ""; for (let i = 0; i < 8; i++) code += A8[Math.floor(Math.random() * A8.length)];
    await setDoc(doc(db, "invites", code), { ownerUid: S.user.uid, ownerEmail: S.user.email, ownerName: S.user.displayName || "", expiresAt: Timestamp.fromMillis(Date.now() + 30 * 60000) });
    S.invite = { code, expires: Date.now() + 30 * 60000 }; render();
  },
  join: async () => {
    const code = String(document.getElementById("joincode").value || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    if (code.length !== 8) return toast("A code has 8 letters and numbers.");
    const snap = await getDoc(doc(db, "invites", code));
    if (!snap.exists()) return toast("That code isn't valid. Ask for a new one.");
    const inv = snap.data();
    if (inv.expiresAt.toDate() < new Date()) return toast("That code has expired. Ask for a new one.");
    if (inv.ownerUid === S.user.uid) return toast("That's your own code.");
    await setDoc(doc(db, "users", inv.ownerUid, "members", S.user.uid), { code, email: S.user.email, name: S.user.displayName || "", joinedAt: serverTimestamp() });
    await setDoc(ownRef("joined", inv.ownerUid), { email: inv.ownerEmail || "", name: inv.ownerName || "" });
    setSpace(inv.ownerUid); toast("Joined. You can now manage their TVs.");
  },
  "remove-member": el => { const m = S.members.find(x => x.id === el.dataset.id); S.modal = { type: "confirm", title: "Remove this person?", body: `${esc(m?.name || m?.email || "They")} will no longer be able to manage your TVs.`, ok: "Remove",
    run: async () => { await deleteDoc(uidRef("members", el.dataset.id)); toast("Removed."); } }; render(); },
  "leave-space": el => { const id = el.dataset.sp; S.modal = { type: "confirm", title: "Leave this space?", body: "You will stop managing their TVs. They can invite you again.", ok: "Leave",
    run: async () => { await deleteDoc(doc(db, "users", id, "members", S.user.uid)).catch(() => {}); await deleteDoc(ownRef("joined", id)).catch(() => {}); if ((S.space || S.user.uid) === id) setSpace(S.user.uid); toast("You left."); } }; render(); },
  scan: () => openScanner(),
  "keep-item": async el => { await merge(uidRef("data", "overrides"), { reviewed: arrayUnion(el.dataset.id) }); toast("Kept. You won't be asked about it again."); },
  "keep-all": async () => { const ids = stale().map(x => x.it.id); if (!ids.length) return; await merge(uidRef("data", "overrides"), { reviewed: arrayUnion(...ids) }); toast("Kept. You won't be asked about these again."); },
  "pick-tv": el => {
    const id = el.dataset.id, sp = el.dataset.sp || S.user.uid;
    try { localStorage.setItem("pr_tv", id); } catch (e) {}
    if (sp !== (S.space || S.user.uid)) { setSpace(sp, id, true); window.scrollTo(0, 0); return; }
    S.tv = id; watchTv(); S.selecting = false; S.sel.clear(); render(); window.scrollTo(0, 0);
  },
  "rename-tv": el => { const d = allDevices().find(x => x.id === el.dataset.id && x.space === el.dataset.sp); S.modal = { type: "tvname", id: el.dataset.id, sp: el.dataset.sp, value: d?.name || "" }; render(); },
  "tvname-save": async () => { const m = S.modal, v = document.getElementById("tn").value.trim(); if (!v) return; await merge(doc(db, "users", m.sp, "devices", m.id), { name: v }); closeModal(); toast("Renamed."); },
  install: async () => {
    S.drawer = false;
    if (S.installEvt) { const e = S.installEvt; S.installEvt = null; e.prompt(); await e.userChoice.catch(() => {}); render(); return; }
    S.modal = { type: "confirm", title: "Add to Home Screen", body: "In Safari, tap the <b>Share</b> button, then <b>Add to Home Screen</b>.", ok: "Got it", run: async () => {} }; render();
  },
  "remove-tv": el => { S.modal = { type: "confirm", title: "Remove this TV?", body: "It stops syncing. You can link it again with a new code.", ok: "Remove",
    run: async () => { await deleteDoc(doc(db, "users", el.dataset.sp, "devices", el.dataset.id)); toast("Removed."); } }; render(); },
};
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (!el || el.tagName === "SELECT" || el.type === "checkbox" && el.dataset.act === "set") return; const f = A[el.dataset.act]; if (f) Promise.resolve(f(el, e)).catch(err => toast("Something went wrong: " + (err.message || err))); });
document.addEventListener("change", e => { const el = e.target; if (el.dataset?.act === "set") A.set(el); if (el.id === "sort" || el.id === "filter" || el.id === "grp") { if (el.id === "sort") S.sort = el.value; else if (el.id === "filter") S.filter = el.value; else S.group = el.checked; savePrefs(); document.getElementById("gridbox").innerHTML = gridHtml(); } });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "rfq") { e.preventDefault(); A["rf-search"](); } });
document.addEventListener("input", e => { if (e.target.id === "code" || e.target.id === "joincode") { const f = fmtCode(e.target.value); if (e.target.value !== f) e.target.value = f; return; } if (e.target.id === "q") { S.q = e.target.value; document.getElementById("gridbox").innerHTML = gridHtml(); } });

// ---------- back button, install, offline shell ----------
// Back opens the menu first (after closing anything open on top); pressing it again leaves.
history.replaceState({ pr: 0 }, "");
history.pushState({ pr: 1 }, "");
addEventListener("popstate", () => {
  if (document.getElementById("scanner")) { history.pushState({ pr: 1 }, ""); stopScan(); return; }
  if (!S.user) return;
  if (S.modal || S.selecting || S.view === "series" || !S.drawer) {
    history.pushState({ pr: 1 }, "");
    if (S.modal) closeModal(); else if (S.selecting) A.select(); else if (S.view === "series") A.back(); else { S.drawer = true; render(); }
    return;
  }
  S.drawer = false; history.back();
});
addEventListener("beforeinstallprompt", e => { e.preventDefault(); S.installEvt = e; render(); });
addEventListener("appinstalled", () => { S.installEvt = null; render(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

// ---------- start ----------
if (configured) {
  const app = initializeApp(FIREBASE_CONFIG); auth = getAuth(app); db = getFirestore(app);
  onAuthStateChanged(auth, user => {
    unsubs.forEach(u => u()); unsubs = []; devUnsubs.forEach(u => u()); devUnsubs = []; spaceUnsubs.forEach(u => u()); spaceUnsubs = []; tvUnsubs.forEach(u => u()); tvUnsubs = []; watchedTv = null; S.user = user; S.ready = true;
    if (user) {
      if (history.state?.pr !== 1) history.pushState({ pr: 1 }, "");
      let saved = null; try { saved = localStorage.getItem("pr_space"); } catch (e) {}
      S.space = saved || user.uid;
      unsubs.push(onSnapshot(collection(db, "users", user.uid, "joined"), s => { S.joined = s.docs.map(d => ({ owner: d.id, ...d.data() })); startAllDeviceWatchers(); render(); }, err => console.warn("listen", err.code)));
      unsubs.push(onSnapshot(collection(db, "users", user.uid, "members"), s => { S.members = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, err => console.warn("listen", err.code)));
      startSpaceWatchers();
      if (S.linkParam) {
        const code = S.linkParam.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
        getDoc(doc(db, "links", code)).then(s => { if (s.exists() && !s.data().claimedBy) { S.modal = { type: "link", code, name: s.data().deviceName }; render(); } }).catch(() => {});
      }
    } else { S.chunks = {}; S.overrides = {}; S.settings = null; S.status = null; S.devices = []; S.joined = []; S.members = []; S.allDevs = {}; S.space = null; S.view = "library"; }
    render();
  });
}
render();
</script>
</body>
